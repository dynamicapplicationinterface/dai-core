[package]
name = "dai-sectioned"
version = "0.1.0"
edition = "2021"
description = "In-place saving of the sectioned DAI container format"

[dependencies]
# The section table and the footer record SHA-256 digests. Nothing else is
# needed here: keeping this crate free of the desktop's dependencies is what
# lets it be tested in seconds, without a webview toolchain.
sha2 = "0.10"
