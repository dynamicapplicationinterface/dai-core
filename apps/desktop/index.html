<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DAI Desktop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0f172a; color: #f8fafc; overflow: hidden; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        flex: 0 0 auto;
        -webkit-app-region: drag;
      }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; color: #60a5fa; }
      header .spacer { flex: 1; }
      button {
        -webkit-app-region: no-drag;
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        color: #f8fafc;
        background: #334155;
        border: 1px solid #475569;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { background: #475569; }
      main { flex: 1 1 auto; position: relative; }
      #slot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      #cartridge {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      body:not(.loaded) #cartridge { display: none; }
      body.loaded #slot { display: none; }
      .badge {
        font-size: 11px;
        padding: 3px 8px;
        background: #1e3a8a;
        color: #93c5fd;
        border-radius: 4px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 15, 29, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .modal-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-card {
        background: #161f38;
        border: 1px solid #2a3756;
        border-radius: 12px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        width: 90%;
        max-width: 700px;
        max-height: 90vh;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        overflow-y: auto;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: #60a5fa;
        margin: 0;
      }
      .close-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 1.25rem;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
        border-radius: 4px;
      }
      .close-btn:hover { color: #f8fafc; background: #2a3756; }
      .field-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .field-label {
        font-size: 0.8125rem;
        font-weight: 500;
        color: #94a3b8;
      }
      .input-text {
        width: 100%;
        padding: 0.625rem 0.875rem;
        font-family: inherit;
        font-size: 0.875rem;
        background: #0b1120;
        border: 1px solid #2a3756;
        border-radius: 6px;
        color: #f8fafc;
      }
      .input-textarea {
        width: 100%;
        min-height: 240px;
        padding: 0.75rem 0.875rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8125rem;
        line-height: 1.5;
        background: #0b1120;
        border: 1px solid #2a3756;
        border-radius: 6px;
        color: #38bdf8;
        resize: vertical;
      }
      .input-text:focus, .input-textarea:focus {
        outline: 2px solid #3b82f6;
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DAI Desktop</h1>
      <span class="spacer"></span>
      <span id="badge" class="badge" hidden></span>
      <button id="create-btn" type="button" style="background:#059669; border-color:#10b981;">+ Create Cartridge</button>
      <button id="open-btn" type="button">Open Container</button>
      <button id="eject-btn" type="button" hidden>Eject</button>
    </header>

    <main>
      <div id="slot">
        <h2>DAI Native Desktop Shell</h2>
        <p style="color: #94a3b8; max-width: 40ch;">
          Double-click any <code>.dai.html</code> cartridge to run in a standalone desktop window with silent in-place persistence.
        </p>
        <div style="display:flex; gap:10px;">
          <button id="choose-btn" type="button" style="font-size:14px; padding:8px 16px;">Choose Cartridge File</button>
          <button id="hero-create-btn" type="button" style="font-size:14px; padding:8px 16px; background:#059669; border-color:#10b981;">+ Create New Cartridge</button>
        </div>
        <div id="status" style="font-size:12px; color:#94a3b8;"></div>
      </div>

      <div id="create-modal" class="modal-overlay">
        <div class="modal-card">
          <div class="modal-header">
            <h2 class="modal-title">🎨 Cartridge Studio — Package & Sign</h2>
            <button id="close-modal-btn" type="button" class="close-btn">✕</button>
          </div>

          <div class="field-group">
            <label class="field-label" for="app-name-input">Cartridge App Name</label>
            <input id="app-name-input" type="text" class="input-text" value="Quick Note Cartridge" />
          </div>

          <div class="field-group">
            <label class="field-label" for="html-source-input">Application Payload (HTML / JS)</label>
            <textarea id="html-source-input" class="input-textarea"><!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quick Note App</title>
    <style>
      body { font-family: system-ui; background: #0f172a; color: #f8fafc; padding: 24px; }
      textarea { width: 100%; height: 160px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
      button { background: #10b981; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h2>📝 Quick Note Cartridge</h2>
    <textarea id="note" placeholder="Write your note here..."></textarea>
    <br><br>
    <button id="save">💾 Save State</button>

    <script>
      const note = document.getElementById("note");
      if (window.dai && window.dai.document && window.dai.document.byteLength > 0) {
        note.value = new TextDecoder().decode(window.dai.document);
      }
      document.getElementById("save").onclick = async () => {
        const bytes = new TextEncoder().encode(note.value);
        if (window.dai && window.dai.saveState) {
          const res = await window.dai.saveState(bytes);
          alert("Saved via " + (res.method || "default"));
        }
      };
    </script>
  </body>
</html></textarea>
          </div>

          <div style="display:flex; gap:12px; justify-content:flex-end;">
            <button id="mint-btn" type="button" style="background:#2563eb; border-color:#3b82f6; font-size:14px; padding:8px 20px;">⚡ Mint & Sign Cartridge</button>
          </div>
          <div id="mint-status" style="font-size:12px; color:#10b981;"></div>
        </div>
      </div>

      <iframe
        id="cartridge"
        title="Running container"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"
        allow="fullscreen"
      ></iframe>
    </main>

    <input id="file-input" type="file" accept=".html,text/html,.dai" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
