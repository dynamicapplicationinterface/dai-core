<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DAI Desktop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0f172a; color: #f8fafc; overflow: hidden; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        flex: 0 0 auto;
        -webkit-app-region: drag;
      }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; color: #60a5fa; }
      header .spacer { flex: 1; }
      button {
        -webkit-app-region: no-drag;
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        color: #f8fafc;
        background: #334155;
        border: 1px solid #475569;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { background: #475569; }
      main { flex: 1 1 auto; position: relative; }
      #slot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      #cartridge {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      body:not(.loaded) #cartridge { display: none; }
      body.loaded #slot { display: none; }
      .badge {
        font-size: 11px;
        padding: 3px 8px;
        background: #1e3a8a;
        color: #93c5fd;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DAI Desktop</h1>
      <span class="spacer"></span>
      <span id="badge" class="badge" hidden></span>
      <button id="create-btn" type="button" style="background:#059669; border-color:#10b981;">+ Create Cartridge</button>
      <button id="open-btn" type="button">Open Container</button>
      <button id="eject-btn" type="button" hidden>Eject</button>
    </header>

    <main>
      <div id="slot">
        <h2>DAI Native Desktop Shell</h2>
        <p style="color: #94a3b8; max-width: 40ch;">
          Double-click any <code>.dai.html</code> cartridge to run in a standalone desktop window with silent in-place persistence.
        </p>
        <div style="display:flex; gap:10px;">
          <button id="choose-btn" type="button" style="font-size:14px; padding:8px 16px;">Choose Cartridge File</button>
          <button id="hero-create-btn" type="button" style="font-size:14px; padding:8px 16px; background:#059669; border-color:#10b981;">+ Create New Cartridge</button>
        </div>
        <div id="status" style="font-size:12px; color:#94a3b8;"></div>
      </div>

      <div id="create-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.95); z-index:100; padding:24px; overflow-y:auto;">
        <div style="max-width:700px; margin:0 auto; background:#1e293b; border:1px solid #334155; border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; font-size:18px; color:#60a5fa;">🎨 Cartridge Studio — Package & Sign</h2>
            <button id="close-modal-btn" type="button" style="background:transparent; border:0; font-size:18px; cursor:pointer;">✕</button>
          </div>

          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="font-size:12px; color:#94a3b8;">Cartridge App Name</label>
            <input id="app-name-input" type="text" value="Quick Note Cartridge" style="padding:8px 12px; font-size:14px; background:#0f172a; border:1px solid #334155; border-radius:6px; color:#fff;" />
          </div>

          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="font-size:12px; color:#94a3b8;">HTML / JS Application Payload</label>
            <textarea id="html-source-input" rows="10" style="padding:12px; font-family:monospace; font-size:12px; background:#0f172a; border:1px solid #334155; border-radius:6px; color:#38bdf8; resize:vertical;"><!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quick Note App</title>
    <style>
      body { font-family: system-ui; background: #0f172a; color: #f8fafc; padding: 24px; }
      textarea { width: 100%; height: 160px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
      button { background: #10b981; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h2>📝 Quick Note Cartridge</h2>
    <textarea id="note" placeholder="Write your note here..."></textarea>
    <br><br>
    <button id="save">💾 Save State</button>

    <script>
      const note = document.getElementById("note");
      if (window.dai && window.dai.document && window.dai.document.byteLength > 0) {
        note.value = new TextDecoder().decode(window.dai.document);
      }
      document.getElementById("save").onclick = async () => {
        const bytes = new TextEncoder().encode(note.value);
        if (window.dai && window.dai.saveState) {
          const res = await window.dai.saveState(bytes);
          alert("Saved via " + (res.method || "default"));
        }
      };
    </script>
  </body>
</html></textarea>
          </div>

          <div style="display:flex; gap:12px; justify-content:flex-end;">
            <button id="mint-btn" type="button" style="background:#2563eb; border-color:#3b82f6; font-size:14px; padding:8px 20px;">⚡ Mint & Sign Cartridge</button>
          </div>
          <div id="mint-status" style="font-size:12px; color:#10b981;"></div>
        </div>
      </div>

      <iframe
        id="cartridge"
        title="Running container"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"
        allow="fullscreen"
      ></iframe>
    </main>

    <input id="file-input" type="file" accept=".html,text/html,.dai" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
