[package]
name = "dai-desktop"
version = "0.1.0"
description = "Native Desktop Shell for DAI Polyglot Containers"
authors = ["DAI Protocol Team"]
edition = "2021"

[lib]
name = "dai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# "devtools" keeps the inspector available in release builds. Without it,
# a packaged installer gives no way to see why a cartridge failed.
tauri = { version = "2.0.0", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
# The sectioned writer, kept out of this crate so it can be tested without a
# webview toolchain — and so a second host could use it without Tauri.
dai-sectioned = { path = "../../../crates/sectioned" }
# Native file chooser. A browser File gives no filesystem path, so a cartridge
# opened through the webview cannot be saved back in place.
tauri-plugin-dialog = "2"
# Forwards a second launch's arguments into the running process. Without it a
# second cartridge starts a second host, and two hosts share one trust registry
# that is read-modify-written without a lock.
tauri-plugin-single-instance = "2"
