[package]
name = "dai-desktop"
version = "0.1.0"
description = "Native Desktop Shell for DAI Polyglot Containers"
authors = ["DAI Protocol Team"]
edition = "2021"

[lib]
name = "dai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# "devtools" keeps the inspector available in release builds. Without it,
# a packaged installer gives no way to see why a cartridge failed.
tauri = { version = "2.0.0", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
