# The mailbox relay — a Cloudflare Worker with one Durable Object per document.
#
# Deploy is the user's: it needs the Cloudflare account that already holds the
# R2 store. `npx wrangler deploy` from this directory. The R2 bucket is the one
# the reference store uses; the mailbox writes under the `mailbox/<doc>/<seq>`
# prefix and touches nothing else.
#
# Retention and entitlement are deferred by the ruling. When retention lands, a
# lifecycle rule on the `mailbox/` prefix is where it goes.

name = "dai-relay"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# One Durable Object class, one mailbox per document (named by id).
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "MailboxDO"

# One object per document for version check-ins (docs/version-ping.md): what
# build a copy holds, and whether the author has published a successor. Kept
# apart from the mailbox because the two learn different things.
[[durable_objects.bindings]]
name = "VERSION"
class_name = "VersionDO"

# A SQLite-backed object: it is the only kind the free plan will create, and the
# storage this one uses — the counter and the digest→cursor index — is the same
# key/value API on either backend, so nothing in the object changes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailboxDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VersionDO"]

# The bytes go to R2 — the same bucket as the reference store, under the
# `mailbox/` prefix. Set `bucket_name` to that bucket before deploying.
[[r2_buckets]]
binding = "MAILBOX_R2"
bucket_name = "dai-store"

# Push (slice two). Make the keys with `node apps/relay/scripts/vapid-keys.mjs`,
# put the public one here and on the opener's build (DAI_PUSH_PUBLIC_KEY), and
# the private one in a secret: `npx wrangler secret put VAPID_PRIVATE_JWK`.
# Empty is push off: subscriptions are kept and nobody is woken.
[vars]
VAPID_PUBLIC_KEY = "BLSvgDVvBYa_zvgTPDxD2DfGGJLzQNNziR3ODT1OoNC1AXGBK327aBgKuefUWt9Y7RmHKAhhVpzVeB_a0w8jXac"
VAPID_SUBJECT = "https://opendai.app"
