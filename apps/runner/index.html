<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Read before the first paint. An address that names a document — a
      shared link, an icon's launch address, a store reference — should never
      show the chooser, not even for the frame it takes the script to load.
      The worker paints the launch screen for a document it knows; a browser
      meeting this page for the first time has no worker, and this is what it
      has instead. Taken off in main.ts the moment there turns out to be
      nothing to open.
    -->
    <script>
      (function () {
        var s = location.search, h = location.hash, p = location.pathname;
        if (/[?&](doc|d)=/.test(s) || /\/[dp]\/[0-9a-f]{64}\/?$/i.test(p) || /^#(a|h|k)=/.test(h) || /[#&](h|k)=/.test(h)) {
          document.documentElement.classList.add("arriving");
        }
        /*
         * The colour under the clock, before the first frame.
         *
         * A home-screen app sits under a status bar the system paints from
         * the page behind it, and it takes that colour as the page first
         * appears; a colour set after that, once the application has drawn
         * and reported its own, was measured to arrive too late. So the
         * colour is remembered per document and per scheme the first time
         * it is known (main.ts keeps it; install.ts owns the key), and a
         * launch at a document's own address paints it here, before layout:
         * on the root, which is what the canvas takes, and as the first
         * theme-color tag, which is what a browser reads.
         *
         * A home-screen app on iOS has storage of its own, apart from
         * Safari's, so on the icon's first launch nothing is remembered
         * here. The icon's address carries the colour as well, put there
         * when the icon was made (install.ts), and that needs no storage.
         * What is remembered wins when both are present: it follows the
         * colour scheme, and the address was written under one of them.
         */
        try {
          var scheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          // An icon's address names the document; a shared link does not yet.
          var doc = /[?&]doc=([^&#]+)/.exec(s);
          var key = doc ? "dai:ground:" + decodeURIComponent(doc[1]) + ":" + scheme : null;
          var ground = key ? localStorage.getItem(key) : null;
          var carried = /[?&]ground=([^&#]+)/.exec(s);
          var fromAddress = false;
          if (!ground && carried) {
            ground = decodeURIComponent(carried[1].replace(/\+/g, " "));
            fromAddress = true;
          }
          if (ground && /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%/]+\)|hsla?\([\d\s.,%/]+\)|[a-z]{3,20})$/i.test(ground)) {
            // What the address carried is now what this device remembers,
            // so an icon made from here carries it on without a second open.
            // (A link names no document yet; main.ts remembers it at mount.)
            if (fromAddress && key) localStorage.setItem(key, ground);
            document.documentElement.style.setProperty("--app-ground", ground);
            var tag = document.createElement("meta");
            tag.name = "theme-color";
            tag.content = ground;
            document.head.appendChild(tag);
          }
        } catch (e) { /* No storage, or no matchMedia: the chooser's colour, as before. */ }
      })();
    </script>
    <!--
      One document, served at more than one path.

      A reference link is `/d/<id>`, and the host serves this same file there
      rather than redirecting, so the link previews and opens without a
      forwarding page. Every relative URL in the page — the engine, the
      confusable table, the worker — would otherwise resolve under `/d/` and
      404. This is what the first attempt got wrong, twice.

      The cost is that a mirror must be served from a domain root. `?d=<id>`
      and the any-host link form work from anywhere.
    -->
    <base href="/" />
    <!--
      Where a link preview goes.

      A host that can run code at the edge replaces this comment with the
      document's name and icon, read from the store's sidecar, when the sender
      asked for a preview. Nothing here depends on that: the tags below are
      what a chat client sees otherwise, and the opener works identically
      either way. The fragment — the hash and the key — is never sent to a
      server, so no preview can be built from the document itself.
    -->
    <!--DAI_PREVIEW-->
    <meta property="og:title" content="A DAI app" />
    <meta property="og:description" content="Runs on your device. No account, nothing installed." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!--
      Which build this is, filled in at build time (vite.config.ts).

      In the page rather than fetched, because it is read on the chooser as
      well as in the menu, and the chooser is where somebody sits whose
      document will not open — possibly with no network. A fetch would also
      have cost the guarantee that opening a document you already have asks
      the network for nothing at all.
    -->
    <meta name="dai-build" content="dev" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DAI</title>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />

    <!--
      No apple-mobile-web-app-status-bar-style, and not by oversight.

      black-translucent puts the page under the status bar and then reports a
      viewport one status bar short of the bottom of the phone: 812pt on an
      874pt iPhone 16 Pro, measured off a screenshot, with the missing 62pt as
      a dead band under the application. Every way of sizing the page - dvh,
      inset: 0, visualViewport.height - inherited it, three attempts running.

      Left alone, iOS keeps the status bar above the web view and paints it in
      this page's theme-color, which main.ts sets to the open application's
      own colour; the web view then reaches the bottom of the phone the way
      every other installed app does. The manifest's display: standalone is
      what makes a home-screen icon launch as an app. The capable tag was the
      pre-manifest way to say the same, and is gone with the other one.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DAI" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <style>
      /*
       * Light, like the phone it is on.
       *
       * The opener was dark-only, and every document opened out of it looked
       * like a thing from somewhere else. What the person is about to see is
       * an app; the screen that introduces it should look like the screen
       * a phone uses to introduce an app — light ground, the icon large, the
       * name, one line about it, and one blue control. Dark follows the
       * system, as an app's would.
       */
      :root {
        color-scheme: light dark;
        --bg: #f2f2f7;
        --chrome: #ffffff;
        --surface: #ffffff;
        --surface-2: #f2f2f7;
        --line: #e5e5ea;
        --line-strong: #d1d1d6;
        --text: #1c1c1e;
        --text-2: #3a3a3c;
        --muted: #6e6e73;
        --faint: #aeaeb2;
        --accent: #007aff;
        --accent-press: #0062cc;
        --on-accent: #ffffff;
        /*
         * The one action on the open screen.
         *
         * Green, and deliberately not the system blue every other control on
         * a phone uses: the first thing testers said about this screen was
         * that it looked like a store page pretending to be one, and the blue
         * pill was most of why.
         */
        --go: #12855a;
        --on-go: #ffffff;
        --ok: #1f8f45;
        --warn: #b25e00;
        --bad: #d70015;
        --scrim: rgba(0, 0, 0, 0.35);
        --shadow: 0 10px 30px rgb(0 0 0 / 0.12);
        --icon-shadow: 0 8px 24px rgb(0 0 0 / 0.16);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --chrome: #0f0f10;
          --surface: #1c1c1e;
          --surface-2: #2c2c2e;
          --line: #2c2c2e;
          --line-strong: #3a3a3c;
          --text: #f2f2f7;
          --text-2: #d1d1d6;
          --muted: #98989d;
          --faint: #636366;
          --accent: #0a84ff;
          --accent-press: #3395ff;
          --on-accent: #ffffff;
          --go: #2fce8b;
          --on-go: #06271a;
          --ok: #30d158;
          --warn: #ffb340;
          --bad: #ff453a;
          --scrim: rgba(0, 0, 0, 0.6);
          --shadow: 0 10px 30px rgb(0 0 0 / 0.5);
          --icon-shadow: 0 8px 24px rgb(0 0 0 / 0.5);
        }
      }
      * { box-sizing: border-box; }
      /*
       * The document is the screen. Everything here is furniture.
       *
       * dvh rather than vh, and the page itself does not scroll: on a phone the
       * address bar collapses as you scroll, vh does not follow it, and the
       * result is an application that drifts up and down inside its own frame
       * while somebody is trying to tick a box.
       */
      /*
       * The page's own ground is the app's colour while a document is open,
       * and on `html` as well as `body`: the strip under a phone's status
       * bar is painted by the system from the canvas behind the page, and
       * the canvas takes its colour from `html`. With it on `body` alone the
       * strip was this app's grey over an application of any other colour.
       */
      html, body { margin: 0; overflow: hidden; background: var(--app-ground, var(--bg)); color: var(--text); }
      /*
       * The whole of what a person can see, and no more.
       *
       * `100dvh` is the viewport actually being shown. In a browser tab it
       * shrinks as the toolbars appear, which is what keeps the bottom of an
       * application out from behind Safari's bar; `inset: 0` is the layout
       * viewport, which runs on underneath that bar and hid the last fifth of
       * every application. In a home-screen app there are no toolbars, and it
       * is the web view, top to bottom.
       *
       * That last sentence was false for a day, and the cause was in the
       * head, not here. With the status bar set to black-translucent, iOS
       * painted the page under the status bar and reported a viewport that
       * stopped one status bar short of the bottom: 812pt on an 874pt phone,
       * with the 62pt left over as a dead band under the application. Every
       * unit inherited it - `100dvh`, `inset: 0`, `visualViewport.height`,
       * each measured off a screenshot and each 62pt short - and three
       * formulations of this rule were written against a viewport that was
       * lying. The tag is gone, and the numbers add up again.
       */
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        box-sizing: border-box;
        /* The fallback first, for a browser that has no dynamic viewport. */
        height: 100vh;
        height: 100dvh;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        overscroll-behavior: none;
      }

      /*
       * Two heights: a chooser before anything is open, and a single slim line
       * afterwards.
       *
       * The first version kept five controls and a key fingerprint on screen at
       * all times — about a fifth of a phone, in vocabulary borrowed from the
       * people who built it. Somebody trying the thing for the first time reads
       * "Eject" and "Export Container" and concludes this is not for them.
       */
      /*
       * Not a bar. One control, floating over the application.
       *
       * Every version of this so far reserved a strip across the top and put
       * the application underneath it, and beside a real installed app the
       * strip was the thing that gave it away: a phone's own apps run to all
       * four edges and float what little chrome they need on top. Apple's
       * Passwords does it, and so does the page this was being written on —
       * one round translucent button in the corner, and the content scrolling
       * behind it.
       *
       * So the application gets the whole screen, under the status bar and
       * down to the home indicator, and what is left of this app is a menu
       * button in the corner. No name and no icon beside it: the application
       * has its own, drawn the way its author drew it, and two of anything is
       * one too many.
       */
      header {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: calc(env(safe-area-inset-top) + 7px) calc(env(safe-area-inset-right) + 10px) 0 0;
        pointer-events: none;
      }
      header > * { pointer-events: auto; }
      header .spacer { display: none; }
      /* No document, no menu: the empty screen carries its own one control. */
      body:not(.loaded):not(.launching) header { display: none; }
      /* The name and the icon are in the menu; the application has its own. */
      #title, #title-icon { display: none; }
      body.loaded #open,
      body.launching #open { display: none; }
      /* Launching into a document: its header, and no chooser underneath. */
      body.launching #slot { visibility: hidden; }
      /*
       * Arriving, or opening: the status line, and nothing else.
       *
       * The chooser used to dim to 0.6 while a document was being read and
       * mounted, which is the same thing as staying on screen. Somebody
       * watching an app open saw "Open a document somebody sent you" and a
       * blue button flash up between the screen they answered and the app
       * they answered it for, and read it as having been sent somewhere else.
       * A transition shows the launch screen and the report line; the pitch
       * for a file they have already chosen is not part of it.
       */
      html.arriving body:not(.loaded) #slot > p,
      html.arriving body:not(.loaded) #open,
      #slot.busy > p,
      #slot.busy #open { display: none; }

      /* The document's name, and nothing else that is not a control. */
      #title {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body:not(.loaded):not(.launching) #title { display: none; }
      #save-state {
        flex: 0 0 auto;
        padding: 2px 8px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--faint);
        cursor: default;
      }
      #save-state[hidden] { display: none; }
      #save-state[data-state="saving"] { color: var(--muted); }
      /*
       * Nothing on screen until there is something wrong.
       *
       * Saving and Saved were the last text in the corner, and reassurance
       * that never leaves is furniture. What has to be seen is a save that did
       * not happen: that is not reassurance, it is somebody's work sitting in
       * memory, and the menu it points at is where Save a copy is. So this is
       * off the screen entirely except when it says so — on the same
       * translucent ground as the menu, because it floats over the same
       * unknown surface.
       */
      #save-state { display: none; }
      #save-state[data-state="failed"] {
        display: inline-flex;
        align-items: center;
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        backdrop-filter: saturate(180%) blur(14px);
        box-shadow: 0 1px 6px rgb(0 0 0 / 0.16);
      }
      #save-state[hidden] { display: none; }
      #save-state[data-state="failed"] { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); cursor: pointer; }

      /*
       * The one control, over whatever the application is drawing.
       *
       * Translucent and blurred rather than filled, because it sits on a
       * surface this app does not choose and cannot know the colour of: a
       * red banner, a photograph, a dark deck. The blur takes its contrast
       * from whatever is behind it, which is what every phone does with a
       * control that floats.
       */
      #more {
        width: 34px;
        height: 34px;
        padding: 0;
        font-size: 17px;
        line-height: 1;
        border-radius: 999px;
        border: 0;
        color: var(--text);
        background: color-mix(in srgb, var(--surface) 62%, transparent);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        backdrop-filter: saturate(180%) blur(14px);
        box-shadow: 0 1px 6px rgb(0 0 0 / 0.16);
      }
      @supports not (backdrop-filter: blur(1px)) {
        #more { background: var(--surface); }
      }
      #more:hover { background: var(--surface); }
      body:not(.loaded) #more { display: none; }

      /* ------------------------------------------------------------ sheet */

      #sheet[hidden] { display: none; }
      #sheet {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--scrim);
      }
      .sheet-panel {
        background: var(--surface);
        border-top: 1px solid var(--line);
        border-radius: 16px 16px 0 0;
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sheet-grip {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--line-strong);
        margin: 2px auto 8px;
      }
      .sheet-panel button {
        width: 100%;
        text-align: left;
        font-size: 16px;
        padding: 14px 16px;
        background: transparent;
        border-color: transparent;
        color: var(--text);
      }
      .sheet-panel button:hover { background: var(--surface-2); }
      .sheet-head { display: flex; align-items: center; gap: 12px; padding: 4px 6px 10px; }
      #sheet-icon { border-radius: 10px; background: var(--surface-2); flex: 0 0 auto; }
      #sheet-icon[hidden] { display: none; }
      .sheet-head-text { min-width: 0; }
      .sheet-name { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sheet-note { margin: 0; font-size: 12.5px; color: var(--muted); }
      .sheet-note[data-state="known"] { color: var(--ok); }
      .sheet-note[data-state="unsigned"] { color: var(--warn); }
      #sheet-mode[data-state="browser"] { color: var(--warn); }
      #sheet-mode[hidden] { display: none; }
      #sheet-kept[hidden] { display: none; }
      #sheet-kept[data-state="kept"] { color: var(--ok); }
      #sheet-kept[data-state="refused"] { color: var(--warn); }
      .sheet-rule { height: 1px; margin: 4px 6px; background: var(--line); }
      /* Readable when looked for, invisible when not. Selectable, because the
         thing a person does with a build id is paste it into a message. */
      .sheet-version {
        margin: 10px 6px 0;
        font-size: 11.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--muted);
        opacity: 0.75;
        text-align: center;
        user-select: text;
        -webkit-user-select: text;
      }
      .sheet-panel button.danger { color: var(--bad); }
      .sheet-panel button.with-glyph { display: flex; align-items: center; gap: 12px; }
      .sheet-panel button.with-glyph svg { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 14px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        cursor: pointer;
      }
      button:hover { background: var(--surface-2); }

      main { flex: 1 1 auto; position: relative; overflow: hidden; }

      /* The chooser is this app's own screen, so it keeps clear of the edges. */
      #slot {
        position: absolute;
        inset: 0;
        padding-top: calc(24px + env(safe-area-inset-top));
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #slot p { margin: 0; color: var(--muted); max-width: 34ch; }
      #slot #open {
        padding: 12px 28px;
        font-size: 16px;
        font-weight: 700;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
      }
      #slot #open:hover { background: var(--accent-press); }
      /* Quieter than the instruction above it: the answer to a question only
         some people arrive with. */
      #slot p.hint { font-size: 13px; color: var(--faint); }
      #slot p.hint a { color: var(--accent); }
      /* Hidden rather than dimmed while a document opens: see above. */

      #report {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        color: var(--muted);
        max-width: 60ch;
      }
      #report.error { color: var(--bad); }

      /* ------------------------------------------------------- keeping it */

      /* The document's own icon beside its name, so the header reads as the document. */
      #title-icon { border-radius: 7px; background: var(--surface-2); flex: 0 0 auto; }
      #title-icon[hidden], body:not(.loaded):not(.launching) #title-icon { display: none; }

      /* A menu item, in the accent, because it is the one the menu is for. */
      #keep-cta { color: var(--accent); font-weight: 600; }
      #keep-cta[hidden], body:not(.loaded) #keep-cta { display: none; }

      /*
       * A dot on the menu while keeping it is on offer.
       *
       * The control used to be its own filled pill in the bar; moving it into
       * the menu without leaving a mark would have made the one gesture no
       * browser teaches invisible. A dot is as much of the screen as it needs.
       */
      body:has(#keep-cta:not([hidden])) #more { position: relative; }
      body:has(#keep-cta:not([hidden])) #more::after {
        content: "";
        position: absolute;
        top: 6px;
        right: 6px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }
      /* Once, after the first use: the eye goes to it and nothing interrupts. */
      @keyframes keep-nudge {
        0%, 100% { transform: scale(1); }
        40% { transform: scale(1.5); }
      }
      body:has(#keep-cta.nudge) #more::after { animation: keep-nudge 900ms ease-out 2; }
      @media (prefers-reduced-motion: reduce) { body:has(#keep-cta.nudge) #more::after { animation: none; } }

      #keep-sheet[hidden] { display: none; }
      #keep-sheet {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--scrim);
      }
      .keep-panel {
        background: var(--surface);
        border-top: 1px solid var(--line);
        border-radius: 20px 20px 0 0;
        padding: 10px 22px calc(18px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
      }
      #keep-icon { border-radius: 16px; background: var(--surface-2); margin-top: 6px; box-shadow: var(--icon-shadow); }
      #keep-title { margin: 6px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
      #keep-sub { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); max-width: 30ch; }
      #keep-steps {
        list-style: none;
        margin: 10px 0 4px;
        padding: 0;
        width: 100%;
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
      }
      #keep-steps:empty { display: none; }
      #keep-steps li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--surface-2);
        font-size: 15px;
      }
      #keep-steps svg { width: 22px; height: 22px; flex: 0 0 auto; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #keep-done {
        margin-top: 8px;
        width: 100%;
        max-width: 24rem;
        padding: 13px 20px;
        font-size: 16px;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--on-accent);
      }
      #keep-done:hover { background: var(--accent-press); }

      #send-sheet[hidden] { display: none; }
      #send-sheet {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--scrim);
      }
      #send-icon { border-radius: 16px; background: var(--surface-2); margin-top: 6px; box-shadow: var(--icon-shadow); }
      #send-icon[hidden] { display: none; }
      #send-title { margin: 6px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
      #send-sub { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); max-width: 32ch; }
      .send-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 24rem;
        margin-top: 6px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--surface-2);
        font-size: 15px;
        text-align: left;
      }
      .send-toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }
      #send-note { margin: 4px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--faint); max-width: 32ch; }
      #send-go {
        margin-top: 8px;
        width: 100%;
        max-width: 24rem;
        padding: 13px 20px;
        font-size: 16px;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--on-accent);
      }
      #send-go:hover { background: var(--accent-press); }
      #send-go:disabled { opacity: 0.6; }
      #send-cancel { border: 0; background: transparent; color: var(--accent); font-size: 15px; padding: 10px; }

      #cartridge {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--app-ground, var(--bg));
        transition: opacity 220ms ease-out;
      }
      body:not(.loaded) #cartridge { display: none; }
      /* Held back until the runtime says the app has drawn; see #launch. */
      body.booting #cartridge { opacity: 0; }

      #launch {
        position: absolute;
        inset: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: border-box;
        z-index: 2;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        /* The app's own colour when it is known, so the first frame is already it. */
        background: var(--app-ground, var(--bg));
      }
      body.launching #launch, body.booting #launch { display: flex; }
      #launch-icon { border-radius: 19px; background: var(--surface); box-shadow: var(--icon-shadow); }
      #launch-icon[hidden] { display: none; }
      #launch-name { margin: 0; font-size: 17px; font-weight: 600; color: var(--text); }
      @media (prefers-reduced-motion: reduce) { #cartridge { transition: none; } }
      body.loaded #slot { display: none; }

      /* ------------------------------------------------------------- card */

      /*
       * The card, in the shape a phone introduces an app: icon, name, one
       * line, one blue control — and under them the facts a person is owed
       * before they open something a stranger sent. The card owns the screen
       * while it is up: nothing else is a decision.
       */
      body.deciding #slot { display: none; }
      /*
       * The open screen. Not a card.
       *
       * It was one: a rounded panel floating on a dimmed page, with the app's
       * name small at the top and four security ticks filling the middle.
       * Testers read that as a store page imitating another store page, and
       * two of them used the word scam. What was wrong was the priority. The
       * app had three lines about itself and the format had a screenful.
       *
       * So: the whole screen, and what the app is and does at the top of it.
       * Who made it and when are facts in a row, in a person's words. Every
       * sentence about isolation, keys and storage is behind one line at the
       * bottom, for the person who wants it — which is a different person
       * from the one deciding whether to open a watch list their brother
       * sent them.
       */
      body.deciding #slot { display: none; }
      #card {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--bg);
        /*
         * Above the running document, because that is when it matters most.
         *
         * A card used to appear on an empty screen: nothing was open, so
         * nothing could be in front of it. A merge offer arrives while the
         * person's own copy is open and on screen — and with both absolutely
         * positioned and no z-index between them, the frame painted last and
         * took the clicks. The card was fully visible and completely inert,
         * which is the worst of the two failures: it looks like the button
         * does nothing.
         */
        z-index: 12;
      }
      #card[hidden] { display: none; }
      /*
       * On a screen with room, a panel in the middle of it.
       *
       * Full bleed is right on a phone, where the screen is the app and there
       * is nothing else to look at. On a desktop the same markup was a narrow
       * column of text pinned to the top of an empty window, with two thirds
       * of the screen below it doing nothing — which reads as a page that
       * failed to finish loading rather than as a decision about a document.
       * So on a wide screen it is what it is: one panel, in the middle,
       * lifted off the ground, with the rest of the window quiet behind it.
       */
      @media (min-width: 700px) and (min-height: 560px) {
        #card {
          display: flex;
          /* Centred, and no taller than what is in it: a flex child stretches
             on the cross axis by default, which made the panel the height of
             the window with the last third of it empty. */
          align-items: center;
          justify-content: center;
          padding: 32px;
          background: var(--bg);
        }
        .card-panel {
          margin: auto;
          max-width: 34rem;
          padding: 0 0 8px;
          background: var(--surface);
          border-radius: 22px;
          box-shadow: var(--shadow);
          overflow: hidden;
        }
        .card-head { padding: 30px 30px 24px; }
        .card-block { padding: 24px 30px; }
        #card-about { margin: 8px 30px 0; }
      }
      .card-panel {
        outline: none;
        width: 100%;
        max-width: 30rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        /* The open screen is this app's own, and clears the island and the bar. */
        padding: env(safe-area-inset-top) 0 calc(30px + env(safe-area-inset-bottom));
        text-align: left;
      }
      .card-head { display: flex; gap: 18px; align-items: flex-start; padding: 26px 22px 22px; }
      #card-icon {
        width: 136px;
        height: 136px;
        flex: 0 0 auto;
        border-radius: 30px;
        background: var(--surface-2);
        box-shadow: var(--icon-shadow);
      }
      #card-icon[hidden] { display: none; }
      /*
       * One column beside the icon: the name, the line under it, and the
       * action, all starting at the same edge. The icon is the picture of the
       * thing and everything that reads as a sentence about it lines up.
       */
      .card-titles {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
      }
      #card-name { margin: 0; font-size: 27px; line-height: 1.06; font-weight: 700; letter-spacing: -0.022em; text-wrap: balance; }
      #card-tagline { margin: 0; font-size: 16px; line-height: 1.38; color: var(--muted); }
      #card-tagline[hidden] { display: none; }

      /* Sized to its word, not to the screen: the app's name stays the
         largest thing here, and this is still the one thing to press. */
      #card-open { margin-top: 5px; }
      #card-open {
        padding: 11px 34px;
        font: inherit;
        font-size: 16.5px;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        background: var(--go);
        color: var(--on-go);
        cursor: pointer;
      }
      #card-open:focus, #keep-cta:focus, #keep-done:focus { outline: none; }
      /*
       * A ring for a keyboard, nothing for a thumb.
       *
       * A script's focus() counts as keyboard focus to both engines, so
       * focusing this button on arrival drew a stroke around it for everybody
       * — which is the mark somebody read as a black outline on the buttons.
       * Arrival focus goes to the top of the screen instead (see showCard), so
       * this fires only when somebody has actually tabbed here.
       */
      #card-open:focus-visible { box-shadow: 0 0 0 4px rgb(18 133 90 / 0.32); }
      #keep-cta:focus-visible, #keep-done:focus-visible { box-shadow: 0 0 0 4px rgb(0 122 255 / 0.28); }

      .card-block { padding: 22px 22px; border-top: 1px solid var(--line); }
      .card-label {
        margin: 0 0 13px;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--faint);
      }

      /* What the app says it does, in its own words (three lines, §recipe). */
      #card-does { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
      #card-does li {
        display: flex;
        gap: 11px;
        align-items: baseline;
        font-size: 17px;
        line-height: 1.4;
        color: var(--text);
      }
      #card-does li::before {
        content: "";
        flex: 0 0 auto;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--go);
        transform: translateY(-3px);
      }
      #card-does-block[hidden] { display: none; }

      /* Who made it, when, and what comes with it. */
      #card-meta { margin: 0; display: grid; gap: 12px; }
      #card-meta > div { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
      #card-meta dt { margin: 0; font-size: 15.5px; color: var(--faint); }
      #card-meta dd {
        margin: 0;
        font-size: 15.5px;
        font-weight: 500;
        color: var(--text-2);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #card-meta dd[data-state="known"] { color: var(--ok); }
      #card-meta dd[data-state="unsigned"], #card-meta dd[data-state="test-key"] { color: var(--warn); }
      #card-meta dd[data-state="conflict"] { color: var(--bad); font-weight: 700; }

      /*
       * A signature that is actively misleading does not go behind a
       * disclosure. Everything else about the publisher does.
       */
      #card-alert { margin: 14px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--warn); font-weight: 500; }
      #card-alert[hidden] { display: none; }
      #card-alert[data-state="conflict"] { color: var(--bad); font-weight: 600; }
      #card-identity { margin: 14px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--ok); }
      #card-identity[hidden] { display: none; }

      #card-succession { margin: 14px 0 0; font-size: 13px; line-height: 1.45; color: var(--text-2); }
      #card-succession[hidden] { display: none; }
      #card-succession[data-state="refused"] { color: var(--warn); }
      #card-clear { margin: 14px 0 0; font-size: 13px; line-height: 1.45; color: var(--warn); }
      #card-clear[hidden] { display: none; }
      #card-from { margin: 14px 0 0; font-size: 12.5px; color: var(--faint); }
      #card-from[hidden] { display: none; }

      /*
       * The format, and everything that is true of every document rather than
       * of this one: the isolation sentences, the key, the sizes, the safety
       * number. One line, at the bottom, opened by whoever wants it.
       */
      /* Below about 360px the icon steps back rather than crushing the name. */
      @media (max-width: 359px) {
        #card-icon { width: 104px; height: 104px; border-radius: 23px; }
        #card-name { font-size: 24px; }
      }
      /* Room to breathe: on anything wider than a phone the name grows. */
      @media (min-width: 480px) {
        #card-name { font-size: 32px; }
        #card-tagline { font-size: 17px; }
      }

      #card-about {
        margin: 8px 22px 0;
        padding: 14px 0 0;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }
      #card-about summary {
        cursor: pointer;
        list-style: none;
        color: var(--faint);
        font-size: 12.5px;
        text-align: center;
      }
      #card-about summary::-webkit-details-marker { display: none; }
      #card-about summary b { color: var(--muted); font-weight: 600; }
      #card-about summary::after { content: " \203A"; }
      #card-about[open] summary::after { content: " \2304"; }
      .card-about-body { display: flex; flex-direction: column; gap: 12px; padding: 16px 0 4px; }
      #card-publisher { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
      #card-publisher[data-state="unsigned"] { color: var(--warn); }
      #card-publisher[data-state="known"] { color: var(--ok); }
      #card-publisher[data-state="new"],
      #card-publisher[data-state="anonymous"] { color: var(--text-2); }
      #card-publisher[data-state="conflict"] { color: var(--bad); font-weight: 600; }
      #card-verify {
        align-self: flex-start;
        padding: 5px 12px;
        font: inherit;
        font-size: 12.5px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }
      #card-verify[hidden], #card-safety[hidden] { display: none; }
      #card-name-publisher {
        align-self: flex-start;
        padding: 0;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }
      #card-name-publisher[hidden] { display: none; }
      #card-safety {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      #card-claims {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 13.5px;
        color: var(--text-2);
      }
      #card-claims li { display: flex; gap: 9px; align-items: baseline; }
      #card-claims li::before { content: "\2713"; color: var(--ok); font-weight: 700; }
      #card-details-list { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
      #card-details-list dt { color: var(--faint); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; align-self: baseline; }
      #card-details-list dd { margin: 0; color: var(--text-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      #card-details[hidden] { display: none; }
      #card-line { margin: 0; font-size: 12.5px; color: var(--faint); font-style: italic; }
    </style>
  </head>

  <body>
    <!--
      There is no reader to see.

      An app is the thing somebody has; this page is the capsule it arrives
      in. So the header exists only while a document is open, and then it is
      the document's: icon, name, the one action that keeps it, and its menu.
      Nothing on screen names the opener, and nothing offers to open a
      different document from inside this one — a document arrives from a
      message or a file, the way documents do.
    -->
    <!--
      A bar, not a frame.

      Beside a home-screen app this read as somebody else's chrome wrapped
      around the application: an icon, the name again, a filled blue pill and
      a menu, above an application that already has its own header. What is
      left is what only this page can offer — which document is open, and the
      way to its menu. The name is in the menu, under the same icon; keeping
      it on the home screen is the menu's first item.
    -->
    <header>
      <img id="title-icon" alt="" width="26" height="26" hidden />
      <span id="title"></span>
      <!--
        Where the data stands, from the runtime's own account: "Saved" once the
        host has it, "Not saved" when it does not — and then this is a button
        to the menu, where Save a copy is. Nothing here is a promise.
      -->
      <button id="save-state" type="button" hidden></button>
      <span class="spacer"></span>
      <button id="more" type="button" aria-label="More" aria-haspopup="dialog">&#8943;</button>
    </header>

    <!--
      Sending it.

      One decision, made where the thing being decided is visible: whether
      what this person has entered goes with it. The name and icon always
      travel, as they do when a phone shares any app; the person can take the
      card off in the share sheet. Everything else is stated, not asked. Small documents travel inside the link itself; larger
      ones are sealed with a fresh key and put in the store, and only the link
      holds the key. Then the phone's own share sheet, or the clipboard.
    -->
    <div id="send-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="send-title">
      <div class="keep-panel">
        <div class="sheet-grip"></div>
        <img id="send-icon" alt="" width="72" height="72" />
        <h2 id="send-title"></h2>
        <p id="send-sub"></p>
        <label class="send-toggle">
          <input id="send-with-data" type="checkbox" checked />
          <span>Send personal saved data</span>
        </label>
        <p id="send-note"></p>
        <button id="send-go" type="button">Send</button>
        <button id="send-cancel" type="button" class="quiet">Not now</button>
        <!-- Shown only when this device has shared this app through the store before. -->
        <button id="send-retire" type="button" class="quiet" hidden></button>
      </div>
    </div>

    <!--
      How to keep it, on this device.

      A sheet in the shape a phone already uses for a decision, with the
      device's own glyphs for the gesture: what the Share button looks like,
      what Add to Home Screen looks like. It appears from the header action
      when the browser has no install prompt to fire — and on iOS only after
      the page has been put at the document's own address, which is what
      Add to Home Screen reads.
    -->
    <div id="keep-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="keep-title">
      <div class="keep-panel">
        <div class="sheet-grip"></div>
        <img id="keep-icon" alt="" width="72" height="72" />
        <h2 id="keep-title"></h2>
        <p id="keep-sub"></p>
        <ol id="keep-steps"></ol>
        <button id="keep-done" type="button">Done</button>
      </div>
    </div>

    <!--
      Everything that is not the document.

      One button on screen instead of four, and the words are what a person
      would use: a copy, closing it, opening another. The key that signed it is
      here rather than in the bar, because "signed a3cab3dd" is a sentence for
      somebody who already knows what it means.
    -->
    <div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Document">
      <div class="sheet-panel">
        <div class="sheet-grip"></div>
        <!-- The document, in the card's own vocabulary: icon, name, who signed it. -->
        <div class="sheet-head">
          <img id="sheet-icon" alt="" width="44" height="44" hidden />
          <div class="sheet-head-text">
            <p class="sheet-name" id="sheet-name"></p>
            <p class="sheet-note" id="sheet-note"></p>
            <!-- Said only after storage has succeeded, never as a promise. -->
            <p class="sheet-note" id="sheet-kept" hidden></p>
            <!--
              Whether this is running as an app or inside a browser.

              A person who added an icon and still sees browser chrome around
              their app has no way to tell whether the icon is a web app or a
              bookmark — iOS makes both, they look the same on the home
              screen, and only one of them gets the whole screen. This says
              which one is on screen, in a person's words, and what to do
              about it when it is the other one.
            -->
            <p class="sheet-note" id="sheet-mode" hidden></p>
          </div>
        </div>
        <!--
          Send, first. What a person means by sharing an app is a link the
          other person taps and is in it — not a file that opens in a viewer
          which cannot run it. The sheet behind this says what will travel.
        -->
        <!--
          Keeping it, first.

          This was a filled pill in the bar at the top, on the theory that the
          one thing a person cannot discover on their own should be the one
          thing on screen. It was also the widest object in a strip of somebody
          else's chrome above an application that had its own header, and the
          screen is what the application is for. So it is here, at the top of
          the menu, and the menu carries a dot while it is being offered.
        -->
        <button id="keep-cta" type="button" class="with-glyph" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 9v6M9 12h6"/></svg>
          <span id="keep-cta-label">Add to Home Screen</span>
        </button>
        <button id="send" type="button" class="with-glyph">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>
          <span>Share app</span>
        </button>
        <button id="export" type="button">Save a copy…</button>
        <!--
          Modify this app (backlog 4.2).

          The source that was sealed into this document, on the clipboard,
          with the header that makes the next version a successor rather than
          a stranger. Pasted into an assistant, it is everything needed to
          change one thing and keep the person's data.
        -->
        <button id="modify" type="button">Change something…</button>
        <div class="sheet-rule"></div>
        <!--
          The one destructive act, in red, at the bottom, where a phone puts it.
          It replaces the library's delete: this device forgets the document,
          its data and its trust pin. A copy saved or sent is not touched.
        -->
        <button id="remove" type="button" class="danger">Remove from this device</button>
        <!--
          Which build this is.

          Production is promoted from main automatically, so "is the fix live"
          is a question about whether a deploy has landed, and the only way to
          answer it from a phone was to grep a bundle and hope. An afternoon of
          testing measured the wrong build three times over. The stamp is
          already written at build time (vite.config.ts); this is where a
          person can read it. Last in the sheet, quiet, and never a control.
        -->
        <p class="sheet-version" id="sheet-version"></p>
      </div>
    </div>

    <main>
      <!--
        The launch screen.

        What a phone shows between the tap and the app's first frame: the
        app's own icon and name on a still ground, and then the app. Without
        it every open went dark chrome, then the shell's light "checking the
        seal" screen, then the app — three paints where a person expects one.
        This stays up from the first paint (the worker fills it in when the
        address names a document, see sw.js) until the runtime says the app is
        interactive, and the frame fades in over it.
      -->
      <div id="launch" aria-hidden="true">
        <img id="launch-icon" alt="" width="84" height="84" hidden />
        <p id="launch-name"></p>
      </div>
      <div id="slot">
        <!--
          Named for what somebody has rather than for its extension. The
          previous line opened with two file suffixes, which is a sentence
          written by the people who chose the suffixes.
        -->
        <p>
          Open a document somebody sent you. Nothing is uploaded — it opens and
          runs here, on this device.
        </p>
        <button id="open" type="button">Open a file</button>
        <p class="hint">
          Not sure what you have?
          <a href="https://www.dynamicapplicationinterface.io/open">What is a .dai file?</a>
        </p>
        <div id="report"></div>
        <!--
          The same build stamp as the menu's, here as well.

          The person who most needs to say which build they are on is the one
          whose document will not open — and that person is looking at this
          screen, which has no menu. Fetched on render: the chooser is not
          under the "a second open asks the network for nothing" guarantee,
          because nothing has been opened.
        -->
        <p class="sheet-version" id="chooser-version"></p>
      </div>
      <!--
        The open screen. See apps/runner/src/card.ts: what somebody is about
        to open, before it opens — the app first, the format last.
      -->
      <div id="card" hidden>
        <div class="card-panel" tabindex="-1">
          <div class="card-head">
            <img id="card-icon" alt="" width="68" height="68" />
            <div class="card-titles">
              <h2 id="card-name"></h2>
              <!-- One line about it, from the app's own <meta name="description">. -->
              <p id="card-tagline" hidden></p>
              <!--
                Under the name and the line, and starting where they start.
                The icon is the picture of the thing; everything that reads as
                a sentence about it, the action included, lines up in one
                column beside the icon rather than under it.
              -->
              <button id="card-open" type="button">Get</button>
        <!--
          Offered only for a sibling, and never the default: the copy already
          here is the one with the person's own work in it, and merging is the
          answer to a question they have to be asked rather than told.
        -->
        <button id="card-merge" type="button" hidden>Merge into my copy</button>
            </div>
          </div>

          <!--
            What the app says it does: up to three lines it declares itself,
            from <meta name="dai:does">. Absent on a document built before the
            recipe asked for them, and then the screen is the line above.
          -->
          <div class="card-block" id="card-does-block" hidden>
            <p class="card-label">What it does</p>
            <ul id="card-does"></ul>
          </div>

          <div class="card-block">
            <dl id="card-meta"></dl>
            <!-- Out here, not behind the disclosure: a signature that misleads. -->
            <p id="card-alert" hidden></p>
            <p id="card-identity" hidden></p>
            <p id="card-succession" hidden></p>
            <!--
              Another copy of a document this device already has (§7).

              Said before anything happens, because merging is a choice and the
              person is the only one who can make it: a host may offer, and
              must never merge on its own. When it cannot be offered, this says
              why in words — a card that reports a merge is unavailable and
              stops has told somebody their document is broken.
            -->
            <p id="card-sibling" hidden></p>
            <!--
              A document a store held unencrypted (backlog 3.4). Shown because
              the person reading this did not choose it.
            -->
            <p id="card-clear" hidden></p>
            <p id="card-from" hidden></p>
          </div>

          <!--
            The format, and what is true of every document rather than of this
            one. One line, and everything technical under it.
          -->
          <details id="card-about">
            <summary>Made with <b>DAI</b>. What that means for your data</summary>
            <div class="card-about-body">
              <p id="card-publisher"></p>
              <button id="card-verify" type="button" hidden>Verify</button>
              <!-- A name for this signing key, on this device. -->
              <button id="card-name-publisher" type="button" hidden>Name this publisher…</button>
              <p id="card-safety" hidden></p>
              <ul id="card-claims"></ul>
              <dl id="card-details-list"></dl>
              <!--
                The one sentence, where the format explains itself. Off the
                front of the screen, which is the app's, and still on it: this
                is the sentence that says what kind of thing somebody is
                holding, and it is written once (see tests/one-sentence).
              -->
              <p id="card-line">Send an app like you send a document.</p>
            </div>
          </details>
        </div>
      </div>

      <iframe
        id="cartridge"
        title="Running container"
        sandbox="allow-scripts allow-same-origin allow-forms allow-downloads"
        allow="fullscreen"
      ></iframe>
    </main>

    <!-- Kept out of the layout; the header button drives it. -->
    <!--
      No accept filter, deliberately. iOS greys out anything the filter does not
      name, and the Files app has no type for `.dai` — so a filter that looked
      tidy on a desktop made the file unselectable on the device this app exists
      for. Whatever is chosen is verified before it runs, which is the check that
      was ever doing the work.
    -->
    <input id="file" type="file" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
