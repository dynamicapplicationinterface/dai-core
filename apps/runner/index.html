<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      One document, served at more than one path.

      A reference link is `/d/<id>`, and the host serves this same file there
      rather than redirecting, so the link previews and opens without a
      forwarding page. Every relative URL in the page — the engine, the
      confusable table, the worker — would otherwise resolve under `/d/` and
      404. This is what the first attempt got wrong, twice.

      The cost is that a mirror must be served from a domain root. `?d=<id>`
      and the any-host link form work from anywhere.
    -->
    <base href="/" />
    <!--
      Where a link preview goes.

      A host that can run code at the edge replaces this comment with the
      document's name and icon, read from the store's sidecar, when the sender
      asked for a preview. Nothing here depends on that: the tags below are
      what a chat client sees otherwise, and the opener works identically
      either way. The fragment — the hash and the key — is never sent to a
      server, so no preview can be built from the document itself.
    -->
    <!--DAI_PREVIEW-->
    <meta property="og:title" content="A DAI app" />
    <meta property="og:description" content="Runs on your device. No account, nothing installed." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DAI</title>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />

    <!-- iOS ignores the manifest for standalone launch and icons. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DAI" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <style>
      /*
       * Light, like the phone it is on.
       *
       * The opener was dark-only, and every document opened out of it looked
       * like a thing from somewhere else. What the person is about to see is
       * an app; the screen that introduces it should look like the screen
       * a phone uses to introduce an app — light ground, the icon large, the
       * name, one line about it, and one blue control. Dark follows the
       * system, as an app's would.
       */
      :root {
        color-scheme: light dark;
        --bg: #f2f2f7;
        --chrome: #ffffff;
        --surface: #ffffff;
        --surface-2: #f2f2f7;
        --line: #e5e5ea;
        --line-strong: #d1d1d6;
        --text: #1c1c1e;
        --text-2: #3a3a3c;
        --muted: #6e6e73;
        --faint: #aeaeb2;
        --accent: #007aff;
        --accent-press: #0062cc;
        --on-accent: #ffffff;
        --ok: #1f8f45;
        --warn: #b25e00;
        --bad: #d70015;
        --scrim: rgba(0, 0, 0, 0.35);
        --shadow: 0 10px 30px rgb(0 0 0 / 0.12);
        --icon-shadow: 0 8px 24px rgb(0 0 0 / 0.16);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --chrome: #0f0f10;
          --surface: #1c1c1e;
          --surface-2: #2c2c2e;
          --line: #2c2c2e;
          --line-strong: #3a3a3c;
          --text: #f2f2f7;
          --text-2: #d1d1d6;
          --muted: #98989d;
          --faint: #636366;
          --accent: #0a84ff;
          --accent-press: #3395ff;
          --on-accent: #ffffff;
          --ok: #30d158;
          --warn: #ffb340;
          --bad: #ff453a;
          --scrim: rgba(0, 0, 0, 0.6);
          --shadow: 0 10px 30px rgb(0 0 0 / 0.5);
          --icon-shadow: 0 8px 24px rgb(0 0 0 / 0.5);
        }
      }
      * { box-sizing: border-box; }
      /*
       * The document is the screen. Everything here is furniture.
       *
       * dvh rather than vh, and the page itself does not scroll: on a phone the
       * address bar collapses as you scroll, vh does not follow it, and the
       * result is an application that drifts up and down inside its own frame
       * while somebody is trying to tick a box.
       */
      html, body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
      /*
       * Pinned to the screen, not sized to it.
       *
       * This was height: 100dvh with the safe-area insets padded inside it. On
       * a home-screen app on iOS that left a band the height of both insets
       * at the bottom — the document painted short, in the opener's grey. A
       * fixed body spanning the whole viewport, with the insets as padding,
       * is what a phone's own apps do: the app frame reaches the edge, and the
       * inset strips are painted in the app's own colour (see --app-ground).
       */
      body {
        position: fixed;
        inset: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        overscroll-behavior: none;
      }
      /* While a document is open, the edges of the screen are its colour. */
      body.loaded { background: var(--app-ground, var(--bg)); }

      /*
       * Two heights: a chooser before anything is open, and a single slim line
       * afterwards.
       *
       * The first version kept five controls and a key fingerprint on screen at
       * all times — about a fifth of a phone, in vocabulary borrowed from the
       * people who built it. Somebody trying the thing for the first time reads
       * "Eject" and "Export Container" and concludes this is not for them.
       */
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: var(--chrome);
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }
      header .spacer { flex: 1; }
      /* No document, no header: the empty screen carries its own one control. */
      body:not(.loaded):not(.launching) header { display: none; }

      body.loaded header,
      body.launching header {
        padding: 0 6px 0 14px;
        min-height: 44px;
        gap: 6px;
      }
      body.loaded #open,
      body.launching #open { display: none; }
      /* Launching into a document: its header, and no chooser underneath. */
      body.launching #slot { visibility: hidden; }

      /* The document's name, and nothing else that is not a control. */
      #title {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body:not(.loaded):not(.launching) #title { display: none; }

      #more {
        width: 36px;
        padding: 0;
        font-size: 18px;
        line-height: 1;
        background: transparent;
        border-color: transparent;
        color: var(--accent);
      }
      #more:hover { background: var(--surface-2); }
      body:not(.loaded) #more { display: none; }

      /* ------------------------------------------------------------ sheet */

      #sheet[hidden] { display: none; }
      #sheet {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--scrim);
      }
      .sheet-panel {
        background: var(--surface);
        border-top: 1px solid var(--line);
        border-radius: 16px 16px 0 0;
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sheet-grip {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--line-strong);
        margin: 2px auto 8px;
      }
      .sheet-panel button {
        width: 100%;
        text-align: left;
        font-size: 16px;
        padding: 14px 16px;
        background: transparent;
        border-color: transparent;
        color: var(--text);
      }
      .sheet-panel button:hover { background: var(--surface-2); }
      .sheet-head { display: flex; align-items: center; gap: 12px; padding: 4px 6px 10px; }
      #sheet-icon { border-radius: 10px; background: var(--surface-2); flex: 0 0 auto; }
      #sheet-icon[hidden] { display: none; }
      .sheet-head-text { min-width: 0; }
      .sheet-name { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sheet-note { margin: 0; font-size: 12.5px; color: var(--muted); }
      .sheet-note[data-state="known"] { color: var(--ok); }
      .sheet-note[data-state="unsigned"] { color: var(--warn); }
      #sheet-kept[hidden] { display: none; }
      #sheet-kept[data-state="kept"] { color: var(--ok); }
      #sheet-kept[data-state="refused"] { color: var(--warn); }
      .sheet-rule { height: 1px; margin: 4px 6px; background: var(--line); }
      .sheet-panel button.danger { color: var(--bad); }
      .sheet-panel button.with-glyph { display: flex; align-items: center; gap: 12px; }
      .sheet-panel button.with-glyph svg { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 14px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        cursor: pointer;
      }
      button:hover { background: var(--surface-2); }

      main { flex: 1 1 auto; position: relative; overflow: hidden; }

      #slot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #slot p { margin: 0; color: var(--muted); max-width: 34ch; }
      #slot #open {
        padding: 12px 28px;
        font-size: 16px;
        font-weight: 700;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
      }
      #slot #open:hover { background: var(--accent-press); }
      /* Quieter than the instruction above it: the answer to a question only
         some people arrive with. */
      #slot p.hint { font-size: 13px; color: var(--faint); }
      #slot p.hint a { color: var(--accent); }
      #slot.busy { opacity: 0.6; }

      #report {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        color: var(--muted);
        max-width: 60ch;
      }
      #report.error { color: var(--bad); }

      /* ------------------------------------------------------- keeping it */

      /* The document's own icon beside its name, so the header reads as the document. */
      #title-icon { border-radius: 7px; background: var(--surface-2); flex: 0 0 auto; }
      #title-icon[hidden], body:not(.loaded):not(.launching) #title-icon { display: none; }

      /* The one filled control while a document is open. */
      #keep-cta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: 999px;
        border: 0;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        flex: 0 0 auto;
      }
      #keep-cta:hover { background: var(--accent-press); }
      #keep-cta svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #keep-cta[hidden], body:not(.loaded) #keep-cta { display: none; }
      /* Once, after the first use: the eye goes to it and nothing interrupts. */
      @keyframes keep-nudge {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgb(0 122 255 / 0.45); }
        40% { transform: scale(1.06); box-shadow: 0 0 0 8px rgb(0 122 255 / 0); }
      }
      #keep-cta.nudge { animation: keep-nudge 900ms ease-out 2; }
      @media (prefers-reduced-motion: reduce) { #keep-cta.nudge { animation: none; } }
      /* On a narrow screen the name gives way to the action, not the reverse. */
      @media (max-width: 380px) { #keep-cta { padding: 7px 11px; font-size: 12.5px; } }

      #keep-sheet[hidden] { display: none; }
      #keep-sheet {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--scrim);
      }
      .keep-panel {
        background: var(--surface);
        border-top: 1px solid var(--line);
        border-radius: 20px 20px 0 0;
        padding: 10px 22px calc(18px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
      }
      #keep-icon { border-radius: 16px; background: var(--surface-2); margin-top: 6px; box-shadow: var(--icon-shadow); }
      #keep-title { margin: 6px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
      #keep-sub { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); max-width: 30ch; }
      #keep-steps {
        list-style: none;
        margin: 10px 0 4px;
        padding: 0;
        width: 100%;
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
      }
      #keep-steps:empty { display: none; }
      #keep-steps li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--surface-2);
        font-size: 15px;
      }
      #keep-steps svg { width: 22px; height: 22px; flex: 0 0 auto; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #keep-done {
        margin-top: 8px;
        width: 100%;
        max-width: 24rem;
        padding: 13px 20px;
        font-size: 16px;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--on-accent);
      }
      #keep-done:hover { background: var(--accent-press); }

      #send-sheet[hidden] { display: none; }
      #send-sheet {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--scrim);
      }
      #send-icon { border-radius: 16px; background: var(--surface-2); margin-top: 6px; box-shadow: var(--icon-shadow); }
      #send-icon[hidden] { display: none; }
      #send-title { margin: 6px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
      #send-sub { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); max-width: 32ch; }
      .send-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 24rem;
        margin-top: 6px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--surface-2);
        font-size: 15px;
        text-align: left;
      }
      .send-toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }
      #send-note { margin: 4px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--faint); max-width: 32ch; }
      #send-go {
        margin-top: 8px;
        width: 100%;
        max-width: 24rem;
        padding: 13px 20px;
        font-size: 16px;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--on-accent);
      }
      #send-go:hover { background: var(--accent-press); }
      #send-go:disabled { opacity: 0.6; }
      #send-cancel { border: 0; background: transparent; color: var(--accent); font-size: 15px; padding: 10px; }

      #cartridge {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
        transition: opacity 220ms ease-out;
      }
      body:not(.loaded) #cartridge { display: none; }
      /* Held back until the runtime says the app has drawn; see #launch. */
      body.booting #cartridge { opacity: 0; }

      #launch {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--bg);
      }
      body.launching #launch, body.booting #launch { display: flex; }
      #launch-icon { border-radius: 19px; background: var(--surface); box-shadow: var(--icon-shadow); }
      #launch-icon[hidden] { display: none; }
      #launch-name { margin: 0; font-size: 17px; font-weight: 600; color: var(--text); }
      @media (prefers-reduced-motion: reduce) { #cartridge { transition: none; } }
      body.loaded #slot { display: none; }

      /* ------------------------------------------------------------- card */

      /*
       * The card, in the shape a phone introduces an app: icon, name, one
       * line, one blue control — and under them the facts a person is owed
       * before they open something a stranger sent. The card owns the screen
       * while it is up: nothing else is a decision.
       */
      body.deciding #slot { display: none; }
      #card {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        overflow: auto;
      }
      #card[hidden] { display: none; }
      .card-panel {
        width: 100%;
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        padding: 22px 20px 20px;
        border-radius: 22px;
        background: var(--surface);
        box-shadow: var(--shadow);
        text-align: left;
      }
      .card-head { display: flex; gap: 16px; align-items: flex-start; }
      #card-icon {
        width: 96px;
        height: 96px;
        flex: 0 0 auto;
        border-radius: 22px;
        background: var(--surface-2);
        box-shadow: var(--icon-shadow);
      }
      #card-icon[hidden] { display: none; }
      .card-titles { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      #card-name { margin: 0; font-size: 22px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
      #card-tagline { margin: 0; font-size: 14px; line-height: 1.35; color: var(--muted); }
      #card-tagline[hidden] { display: none; }
      #card-open {
        align-self: flex-start;
        margin-top: 8px;
        padding: 8px 26px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        cursor: pointer;
      }
      #card-open:hover { background: var(--accent-press); }
      /* Focused on arrival so a keyboard can press it; a ring only when a keyboard is what got here. */
      /* No ring: WebKit treats a script's focus() as keyboard focus and drew a
         black stroke around the one control on the card. A soft accent halo
         for a real keyboard user; nothing for a thumb. */
      #card-open:focus, #keep-cta:focus, #keep-done:focus { outline: none; }
      #card-open:focus-visible, #keep-cta:focus-visible, #keep-done:focus-visible { box-shadow: 0 0 0 4px rgb(0 122 255 / 0.28); }

      /* The facts row: what a store page shows in a strip, this shows about the file. */
      #card-facts {
        list-style: none;
        margin: 0;
        padding: 10px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }
      #card-facts li {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 2px 6px;
        text-align: center;
        border-left: 1px solid var(--line);
        min-width: 0;
      }
      #card-facts li:first-child { border-left: 0; }
      .fact-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
      .fact-value { font-size: 16px; font-weight: 700; color: var(--text-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fact-sub { font-size: 11.5px; color: var(--muted); }
      #fact-publisher[data-state="known"] { color: var(--ok); }
      #fact-publisher[data-state="unsigned"], #fact-publisher[data-state="test-key"] { color: var(--warn); }
      #fact-publisher[data-state="conflict"] { color: var(--bad); }

      #card-publisher { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
      #card-publisher[data-state="unsigned"] { color: var(--warn); }
      /* Known is the one state that gets to look good. */
      #card-publisher[data-state="known"] { color: var(--ok); }
      /* New and anonymous are neutral: nothing is wrong, nothing is established. */
      #card-publisher[data-state="new"],
      #card-publisher[data-state="anonymous"] { color: var(--text-2); }
      /* Conflict is red: a key this device has never seen, using a name it has. */
      #card-publisher[data-state="conflict"] { color: var(--bad); font-weight: 600; }
      #card-identity { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ok); }
      #card-identity[hidden] { display: none; }
      #card-verify {
        align-self: flex-start;
        padding: 5px 12px;
        font: inherit;
        font-size: 12.5px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }
      #card-verify[hidden], #card-safety[hidden] { display: none; }
      #card-name-publisher {
        align-self: flex-start;
        padding: 0;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }
      #card-name-publisher[hidden] { display: none; }
      #card-safety {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      #card-claims {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 14px;
        color: var(--text-2);
      }
      #card-claims li { display: flex; gap: 9px; align-items: baseline; }
      #card-claims li::before { content: "✓"; color: var(--ok); font-weight: 700; }
      #card-details { font-size: 13px; color: var(--muted); }
      #card-details summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; }
      #card-details summary::-webkit-details-marker { display: none; }
      #card-details summary::after { content: " ›"; }
      #card-details[open] summary::after { content: " ⌄"; }
      #card-details-list { margin: 8px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
      #card-details-list dt { color: var(--faint); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; align-self: baseline; }
      #card-details-list dd { margin: 0; color: var(--text-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      #card-inspect {
        align-self: center;
        padding: 6px 10px;
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        border: 0;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }
      #card-inspect[hidden] { display: none; }
      #card-succession { margin: 0; font-size: 13px; line-height: 1.45; color: var(--text-2); }
      #card-succession[hidden] { display: none; }
      #card-succession[data-state="refused"] { color: var(--warn); }
      #card-clear { margin: 0; font-size: 13px; line-height: 1.45; color: var(--warn); }
      #card-clear[hidden] { display: none; }
      #card-from { margin: 0; font-size: 12.5px; color: var(--faint); text-align: center; }
      #card-from[hidden] { display: none; }
      /* The standing line. Quiet, because the decision above it is louder. */
      #card-line { margin: 0; font-size: 12.5px; color: var(--faint); font-style: italic; text-align: center; }
    </style>
  </head>

  <body>
    <!--
      There is no reader to see.

      An app is the thing somebody has; this page is the capsule it arrives
      in. So the header exists only while a document is open, and then it is
      the document's: icon, name, the one action that keeps it, and its menu.
      Nothing on screen names the opener, and nothing offers to open a
      different document from inside this one — a document arrives from a
      message or a file, the way documents do.
    -->
    <header>
      <img id="title-icon" alt="" width="26" height="26" hidden />
      <span id="title"></span>
      <span class="spacer"></span>
      <!--
        The one action, where the thumb already is.

        A document somebody has just watched run is, to them, a web page. The
        thing that makes it theirs — an icon that opens it, offline, with its
        own name — is a gesture no browser will show them. So it is the one
        filled control on the screen while a document is open, in the words
        the device uses, and it stays there; a control is not a question, so
        there is nothing to dismiss. See install.ts for what it does per device.
      -->
      <button id="keep-cta" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 9v6M9 12h6"/></svg>
        <span id="keep-cta-label">Add to Home Screen</span>
      </button>
      <button id="more" type="button" aria-label="More" aria-haspopup="dialog">&#8943;</button>
    </header>

    <!--
      Sending it.

      One decision, made where the thing being decided is visible: whether the
      message preview may show the app's name and icon. Everything else is
      stated, not asked. Small documents travel inside the link itself; larger
      ones are sealed with a fresh key and put in the store, and only the link
      holds the key. Then the phone's own share sheet, or the clipboard.
    -->
    <div id="send-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="send-title">
      <div class="keep-panel">
        <div class="sheet-grip"></div>
        <img id="send-icon" alt="" width="72" height="72" />
        <h2 id="send-title"></h2>
        <p id="send-sub"></p>
        <label class="send-toggle">
          <input id="send-with-data" type="checkbox" checked />
          <span>Include what I have entered</span>
        </label>
        <label class="send-toggle">
          <input id="send-preview" type="checkbox" checked />
          <span>Show the name and icon in the message preview</span>
        </label>
        <p id="send-note"></p>
        <button id="send-go" type="button">Send</button>
        <button id="send-cancel" type="button" class="quiet">Not now</button>
      </div>
    </div>

    <!--
      How to keep it, on this device.

      A sheet in the shape a phone already uses for a decision, with the
      device's own glyphs for the gesture: what the Share button looks like,
      what Add to Home Screen looks like. It appears from the header action
      when the browser has no install prompt to fire — and on iOS only after
      the page has been put at the document's own address, which is what
      Add to Home Screen reads.
    -->
    <div id="keep-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="keep-title">
      <div class="keep-panel">
        <div class="sheet-grip"></div>
        <img id="keep-icon" alt="" width="72" height="72" />
        <h2 id="keep-title"></h2>
        <p id="keep-sub"></p>
        <ol id="keep-steps"></ol>
        <button id="keep-done" type="button">Done</button>
      </div>
    </div>

    <!--
      Everything that is not the document.

      One button on screen instead of four, and the words are what a person
      would use: a copy, closing it, opening another. The key that signed it is
      here rather than in the bar, because "signed a3cab3dd" is a sentence for
      somebody who already knows what it means.
    -->
    <div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Document">
      <div class="sheet-panel">
        <div class="sheet-grip"></div>
        <!-- The document, in the card's own vocabulary: icon, name, who signed it. -->
        <div class="sheet-head">
          <img id="sheet-icon" alt="" width="44" height="44" hidden />
          <div class="sheet-head-text">
            <p class="sheet-name" id="sheet-name"></p>
            <p class="sheet-note" id="sheet-note"></p>
            <!-- Said only after storage has succeeded, never as a promise. -->
            <p class="sheet-note" id="sheet-kept" hidden></p>
          </div>
        </div>
        <!--
          Send, first. What a person means by sharing an app is a link the
          other person taps and is in it — not a file that opens in a viewer
          which cannot run it. The sheet behind this says what will travel.
        -->
        <button id="send" type="button" class="with-glyph">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>
          <span>Share app</span>
        </button>
        <button id="export" type="button">Save a copy…</button>
        <!--
          Modify this app (backlog 4.2).

          The source that was sealed into this document, on the clipboard,
          with the header that makes the next version a successor rather than
          a stranger. Pasted into an assistant, it is everything needed to
          change one thing and keep the person's data.
        -->
        <button id="modify" type="button">Change something…</button>
        <div class="sheet-rule"></div>
        <!--
          The one destructive act, in red, at the bottom, where a phone puts it.
          It replaces the library's delete: this device forgets the document,
          its data and its trust pin. A copy saved or sent is not touched.
        -->
        <button id="remove" type="button" class="danger">Remove from this device</button>
      </div>
    </div>

    <main>
      <!--
        The launch screen.

        What a phone shows between the tap and the app's first frame: the
        app's own icon and name on a still ground, and then the app. Without
        it every open went dark chrome, then the shell's light "checking the
        seal" screen, then the app — three paints where a person expects one.
        This stays up from the first paint (the worker fills it in when the
        address names a document, see sw.js) until the runtime says the app is
        interactive, and the frame fades in over it.
      -->
      <div id="launch" aria-hidden="true">
        <img id="launch-icon" alt="" width="84" height="84" hidden />
        <p id="launch-name"></p>
      </div>
      <div id="slot">
        <!--
          Named for what somebody has rather than for its extension. The
          previous line opened with two file suffixes, which is a sentence
          written by the people who chose the suffixes.
        -->
        <p>
          Open a document somebody sent you. Nothing is uploaded — it opens and
          runs here, on this device.
        </p>
        <button id="open" type="button">Open a file</button>
        <p class="hint">
          Not sure what you have?
          <a href="https://www.dynamicapplicationinterface.io/open">What is a .dai file?</a>
        </p>
        <div id="report"></div>
      </div>
      <!--
        The launch card. See apps/runner/src/card.ts: what somebody is about to
        open, before it opens, with ticks that name the clauses backing them.
      -->
      <div id="card" hidden>
        <div class="card-panel">
          <div class="card-head">
            <img id="card-icon" alt="" width="96" height="96" />
            <div class="card-titles">
              <h2 id="card-name"></h2>
              <!-- One line about it, from the app's own <meta name="description">. -->
              <p id="card-tagline" hidden></p>
              <button id="card-open" type="button">Open</button>
            </div>
          </div>
          <ul id="card-facts">
            <li><span class="fact-label">Publisher</span><span id="fact-publisher" class="fact-value"></span></li>
            <li><span class="fact-label">Data</span><span id="fact-data" class="fact-value"></span></li>
            <li><span class="fact-label">Runs</span><span class="fact-value">Offline</span><span class="fact-sub">on this device</span></li>
          </ul>
          <p id="card-publisher"></p>
          <p id="card-identity" hidden></p>
          <button id="card-verify" type="button" hidden>Verify</button>
          <!-- A name for this signing key, on this device — offered here, where who signed it is in view. -->
          <button id="card-name-publisher" type="button" hidden>Name this publisher…</button>
          <p id="card-safety" hidden></p>
          <ul id="card-claims"></ul>
          <!--
            The technical facts — key, dates, size — under a disclosure. The
            card answers in plain sentences; these are for whoever wants to
            check them, and are labelled for what they are: the publisher's
            claims where they are claims.
          -->
          <details id="card-details">
            <summary>Details</summary>
            <dl id="card-details-list"></dl>
          </details>
          <p id="card-succession" hidden></p>
          <!--
            A document a store held unencrypted (backlog 3.4).

            Shown because the person reading this did not choose it. Every
            other reference link is opened by a key that never reaches a
            server; this one was not.
          -->
          <p id="card-clear" hidden></p>
          <!--
            Look inside, before running it (backlog 1.5).

            The playground reads the same bytes and never mounts them: it
            unpacks the archive, recomputes every digest and checks the
            signature, and shows what it found. Somebody who wants to know what
            is in a document before they run it has had no way to find out that
            did not involve trusting this page's summary of it.

            Hidden unless a document is on the card, because there is nothing
            to look inside of otherwise.
          -->
          <button id="card-inspect" type="button" hidden>Look inside first</button>
          <p id="card-from" hidden></p>
          <p id="card-line">Send an app like you send a document.</p>
        </div>
      </div>

      <iframe
        id="cartridge"
        title="Running container"
        sandbox="allow-scripts allow-same-origin allow-forms allow-downloads"
        allow="fullscreen"
      ></iframe>
    </main>

    <!-- Kept out of the layout; the header button drives it. -->
    <!--
      No accept filter, deliberately. iOS greys out anything the filter does not
      name, and the Files app has no type for `.dai` — so a filter that looked
      tidy on a desktop made the file unselectable on the device this app exists
      for. Whatever is chosen is verified before it runs, which is the check that
      was ever doing the work.
    -->
    <input id="file" type="file" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
