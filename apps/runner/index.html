<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DAI Opener</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />

    <!-- iOS ignores the manifest for standalone launch and icons. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DAI" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #111827; color: #e5e7eb; }
      body {
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #1f2937;
        flex: 0 0 auto;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .spacer { flex: 1; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 14px;
        color: #e5e7eb;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 7px;
        cursor: pointer;
      }
      button:hover { background: #374151; }

      main { flex: 1 1 auto; position: relative; overflow: hidden; }

      #slot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #slot p { margin: 0; color: #9ca3af; max-width: 34ch; }
      /* Quieter than the instruction above it: the answer to a question only
         some people arrive with. */
      #slot p.hint { font-size: 13px; color: #6b7280; }
      #slot p.hint a { color: #93c5fd; }
      #slot.busy { opacity: 0.6; }

      #report {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        color: #9ca3af;
        max-width: 60ch;
      }
      #report.error { color: #fca5a5; }

      #library {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }
      .tray-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 8px;
        text-align: left;
      }
      .tray-info { flex: 1; overflow: hidden; }
      .tray-title { font-weight: 600; color: #f3f4f6; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tray-sub { font-size: 12px; color: #9ca3af; }
      .tray-actions { display: flex; gap: 6px; }
      .btn-del { background: #7f1d1d; border-color: #991b1b; color: #fecaca; }
      .btn-del:hover { background: #991b1b; }

      #cartridge {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      body:not(.loaded) #cartridge { display: none; }
      body.loaded #slot { display: none; }
    </style>
  </head>

  <body>
    <header>
      <h1>DAI Opener</h1>
      <span class="spacer"></span>
      <span id="badge" hidden></span>
      <button id="export" type="button" hidden>Export Container</button>
      <button id="eject" type="button" hidden>Eject</button>
      <button id="open" type="button">Open app</button>
    </header>

    <main>
      <div id="slot">
        <p>
          Choose a <code>.dai</code> or <code>.dai.html</code> file to run. Nothing is
          uploaded — the file is read and run on this device.
        </p>
        <p class="hint">
          Not sure what you have?
          <a href="https://www.dynamicapplicationinterface.io/open">What is a .dai file?</a>
        </p>
        <div id="report"></div>
        <div id="library"></div>
      </div>
      <iframe
        id="cartridge"
        title="Running container"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"
        allow="fullscreen"
      ></iframe>
    </main>

    <!-- Kept out of the layout; the header button drives it. -->
    <!--
      No accept filter, deliberately. iOS greys out anything the filter does not
      name, and the Files app has no type for `.dai` — so a filter that looked
      tidy on a desktop made the file unselectable on the device this app exists
      for. Whatever is chosen is verified before it runs, which is the check that
      was ever doing the work.
    -->
    <input id="file" type="file" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
