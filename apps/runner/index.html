<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DAI Opener</title>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />

    <!-- iOS ignores the manifest for standalone launch and icons. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DAI" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      /*
       * The document is the screen. Everything here is furniture.
       *
       * dvh rather than vh, and the page itself does not scroll: on a phone the
       * address bar collapses as you scroll, vh does not follow it, and the
       * result is an application that drifts up and down inside its own frame
       * while somebody is trying to tick a box.
       */
      html, body { margin: 0; height: 100dvh; overflow: hidden; background: #111827; color: #e5e7eb; }
      body {
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        overscroll-behavior: none;
      }

      /*
       * Two heights: a chooser before anything is open, and a single slim line
       * afterwards.
       *
       * The first version kept five controls and a key fingerprint on screen at
       * all times — about a fifth of a phone, in vocabulary borrowed from the
       * people who built it. Somebody trying the thing for the first time reads
       * "Eject" and "Export Container" and concludes this is not for them.
       */
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #1f2937;
        flex: 0 0 auto;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .spacer { flex: 1; }

      body.loaded header {
        padding: 0 6px 0 14px;
        min-height: 44px;
        gap: 6px;
      }
      body.loaded header h1,
      body.loaded #open { display: none; }

      /* The document's name, and nothing else that is not a control. */
      #title {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body:not(.loaded) #title { display: none; }

      #more {
        width: 36px;
        padding: 0;
        font-size: 18px;
        line-height: 1;
        background: transparent;
        border-color: transparent;
      }
      #more:hover { background: #1f2937; }
      body:not(.loaded) #more { display: none; }

      /* ------------------------------------------------------------ sheet */

      #sheet[hidden] { display: none; }
      #sheet {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: rgba(3, 7, 18, 0.6);
      }
      .sheet-panel {
        background: #111827;
        border-top: 1px solid #1f2937;
        border-radius: 16px 16px 0 0;
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sheet-grip {
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: #374151;
        margin: 2px auto 8px;
      }
      .sheet-panel button {
        width: 100%;
        text-align: left;
        font-size: 16px;
        padding: 14px 16px;
        background: transparent;
        border-color: transparent;
      }
      .sheet-panel button:hover { background: #1f2937; }
      .sheet-note {
        margin: 4px 4px 8px;
        font-size: 12px;
        color: #6b7280;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 14px;
        color: #e5e7eb;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 7px;
        cursor: pointer;
      }
      button:hover { background: #374151; }

      main { flex: 1 1 auto; position: relative; overflow: hidden; }

      #slot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #slot p { margin: 0; color: #9ca3af; max-width: 34ch; }
      /* Quieter than the instruction above it: the answer to a question only
         some people arrive with. */
      #slot p.hint { font-size: 13px; color: #6b7280; }
      #slot p.hint a { color: #93c5fd; }
      #slot.busy { opacity: 0.6; }

      #report {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        color: #9ca3af;
        max-width: 60ch;
      }
      #report.error { color: #fca5a5; }

      #library {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }
      .tray-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 8px;
        text-align: left;
      }
      .tray-info { flex: 1; overflow: hidden; }
      .tray-title { font-weight: 600; color: #f3f4f6; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tray-sub { font-size: 12px; color: #9ca3af; }
      .tray-actions { display: flex; gap: 6px; }
      .btn-del { background: #7f1d1d; border-color: #991b1b; color: #fecaca; }
      .btn-del:hover { background: #991b1b; }

      /* Sits over the running app, out of the way of its own chrome. */
      #install {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 12px 14px;
        border-radius: 14px;
        background: #1f2937;
        border: 1px solid #374151;
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.4);
      }
      #install[hidden] { display: none; }
      #keep-how { margin: 4px 0 8px; padding: 12px 14px; border-radius: 12px; background: #111827; font-size: 14px; line-height: 1.45; }
      #keep-how[hidden] { display: none; }
      #keep-how .keep-title { margin: 0 0 6px; font-weight: 600; }
      #keep-how ol { margin: 0; padding-left: 20px; }
      #keep-how li + li { margin-top: 4px; }
      #install p { margin: 0; flex: 1 1 180px; font-size: 13px; line-height: 1.4; }
      #install button {
        font: inherit;
        font-size: 13px;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: transparent;
        color: #e5e7eb;
      }
      #install #install-go { background: #2563eb; border-color: #2563eb; color: #fff; }

      #cartridge {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      body:not(.loaded) #cartridge { display: none; }
      body.loaded #slot { display: none; }

      /* The card owns the screen while it is up: nothing else is a decision. */
      body.deciding #slot { display: none; }
      #card {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: auto;
      }
      #card[hidden] { display: none; }
      .card-panel {
        width: 100%;
        max-width: 22rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 26px 22px 22px;
        border-radius: 20px;
        background: #1f2937;
        border: 1px solid #374151;
        text-align: center;
      }
      #card-icon { border-radius: 16px; background: #111827; }
      #card-icon[hidden] { display: none; }
      #card-name { margin: 2px 0 0; font-size: 21px; font-weight: 650; }
      #card-publisher { margin: 0; font-size: 13px; line-height: 1.45; color: #9ca3af; }
      #card-publisher[data-state="unsigned"] { color: #fbbf24; }
      /* Known is the one state that gets to look good. */
      #card-publisher[data-state="known"] { color: #34d399; }
      /* New and anonymous are neutral: nothing is wrong, nothing is established. */
      #card-publisher[data-state="new"],
      #card-publisher[data-state="anonymous"] { color: #d1d5db; }
      /* Conflict is red: a key this device has never seen, using a name it has. */
      #card-publisher[data-state="conflict"] { color: #f87171; font-weight: 600; }
      #card-verify {
        padding: 5px 12px;
        font: inherit;
        font-size: 12.5px;
        border: 1px solid #4b5563;
        border-radius: 8px;
        background: transparent;
        color: #d1d5db;
        cursor: pointer;
      }
      #card-verify[hidden], #card-safety[hidden] { display: none; }
      #card-safety {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: #d1d5db;
        font-variant-numeric: tabular-nums;
      }
      #card-claims {
        margin: 8px 0 4px;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-self: stretch;
        text-align: left;
        font-size: 14px;
        color: #d1d5db;
      }
      #card-claims li { display: flex; gap: 9px; align-items: baseline; }
      #card-claims li::before { content: "✓"; color: #34d399; font-weight: 700; }
      #card-open {
        margin-top: 6px;
        align-self: stretch;
        padding: 13px 20px;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      #card-from { margin: 2px 0 0; font-size: 12.5px; color: #6b7280; }
      #card-from[hidden] { display: none; }
      /* The standing line. Quiet, because the decision above it is louder. */
      #card-line { margin: 10px 0 0; font-size: 12.5px; color: #6b7280; font-style: italic; }
    </style>
  </head>

  <body>
    <header>
      <h1>DAI Opener</h1>
      <span id="title"></span>
      <span class="spacer"></span>
      <button id="open" type="button">Open a file</button>
      <button id="more" type="button" aria-label="More" aria-haspopup="dialog">&#8943;</button>
    </header>

    <!--
      Everything that is not the document.

      One button on screen instead of four, and the words are what a person
      would use: a copy, closing it, opening another. The key that signed it is
      here rather than in the bar, because "signed a3cab3dd" is a sentence for
      somebody who already knows what it means.
    -->
    <div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Document">
      <div class="sheet-panel">
        <div class="sheet-grip"></div>
        <p class="sheet-note" id="sheet-note"></p>
        <button id="export" type="button">Save a copy</button>
        <button id="link" type="button">Copy a link</button>
        <!--
          Always here, not only in a bar that can be dismissed. The bar says it
          once; this is where somebody finds it again, and where the steps for
          this particular device are spelled out.
        -->
        <button id="keep" type="button">Keep on this device</button>
        <div id="keep-how" hidden></div>
        <button id="open-another" type="button">Open a different file</button>
        <button id="eject" type="button">Close this document</button>
      </div>
    </div>

    <main>
      <div id="slot">
        <!--
          Named for what somebody has rather than for its extension. The
          previous line opened with two file suffixes, which is a sentence
          written by the people who chose the suffixes.
        -->
        <p>
          Open a document somebody sent you. Nothing is uploaded — it opens and
          runs here, on this device.
        </p>
        <p class="hint">
          Not sure what you have?
          <a href="https://www.dynamicapplicationinterface.io/open">What is a .dai file?</a>
        </p>
        <div id="report"></div>
        <div id="library"></div>
      </div>
      <!--
        The launch card. See apps/runner/src/card.ts: what somebody is about to
        open, before it opens, with ticks that name the clauses backing them.
      -->
      <div id="card" hidden>
        <div class="card-panel">
          <img id="card-icon" alt="" width="72" height="72" />
          <h2 id="card-name"></h2>
          <p id="card-publisher"></p>
          <button id="card-verify" type="button" hidden>Verify</button>
          <p id="card-safety" hidden></p>
          <ul id="card-claims"></ul>
          <button id="card-open" type="button">Open it</button>
          <p id="card-from" hidden></p>
          <p id="card-line">Send an app like you send a document.</p>
        </div>
      </div>

      <iframe
        id="cartridge"
        title="Running container"
        sandbox="allow-scripts allow-same-origin allow-forms allow-downloads"
        allow="fullscreen"
      ></iframe>
    </main>

    <!--
      The step that turns a tab into an app.

      Somebody who has just watched their document run has no idea that this is
      keepable. On a phone the browser will never tell them, and the gesture
      that does it — Share, then Add to Home Screen — is buried and unguessable.
      Saying it once, at the only moment it makes sense, is the difference
      between a thing somebody tried and a thing somebody has.

      Only honest because the opener reopens what was last open: a home screen
      icon lands in their document rather than on an empty chooser.
    -->
    <div id="install" hidden>
      <p id="install-text"></p>
      <button id="install-go" type="button" hidden>Add to Home Screen</button>
      <button id="install-dismiss" type="button" aria-label="Dismiss">Not now</button>
    </div>

    <!-- Kept out of the layout; the header button drives it. -->
    <!--
      No accept filter, deliberately. iOS greys out anything the filter does not
      name, and the Files app has no type for `.dai` — so a filter that looked
      tidy on a desktop made the file unselectable on the device this app exists
      for. Whatever is chosen is verified before it runs, which is the check that
      was ever doing the work.
    -->
    <input id="file" type="file" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
