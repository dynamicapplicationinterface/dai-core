<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DAI Runner</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />

    <!-- iOS ignores the manifest for standalone launch and icons. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DAI" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #111827; color: #e5e7eb; }
      body {
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #1f2937;
        flex: 0 0 auto;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .spacer { flex: 1; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 14px;
        color: #e5e7eb;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 7px;
        cursor: pointer;
      }
      button:hover { background: #374151; }

      main { flex: 1 1 auto; position: relative; overflow: hidden; }

      #slot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #slot p { margin: 0; color: #9ca3af; max-width: 34ch; }
      #slot.busy { opacity: 0.6; }

      #report {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        color: #9ca3af;
        max-width: 60ch;
      }
      #report.error { color: #fca5a5; }

      #cartridge {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      body:not(.loaded) #cartridge { display: none; }
      body.loaded #slot { display: none; }
    </style>
  </head>

  <body>
    <header>
      <h1>DAI Runner</h1>
      <span class="spacer"></span>
      <span id="badge" hidden></span>
      <button id="export" type="button" hidden>Export Container</button>
      <button id="eject" type="button" hidden>Eject</button>
      <button id="open" type="button">Open app</button>
    </header>

    <main>
      <div id="slot">
        <p>
          Choose a <code>.dai.html</code> container to run. Nothing is uploaded —
          the file is read and executed on this device.
        </p>
        <div id="report"></div>
      </div>
      <iframe
        id="cartridge"
        title="Running container"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"
        allow="fullscreen"
      ></iframe>
    </main>

    <!-- Kept out of the layout; the header button drives it. -->
    <input id="file" type="file" accept=".html,text/html" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
