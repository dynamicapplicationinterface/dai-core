name: test

on:
  push:
    branches: [main]
  pull_request:

# The suite needs to read the repository and nothing else. Without this the
# token defaults to whatever the repository's setting allows, which on a public
# repository is a wider grant than a test run has any use for.
permissions:
  contents: read

jobs:
  # The non-browser checks, on their own so a compile or reference-reader
  # failure is reported as itself and does not sit behind twelve minutes of
  # Playwright.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Every generated file that is committed, held to what generates it. A
      # generator whose output is committed and never compared drifts in
      # silence: the conformance suite had carried an older shell than the
      # build makes, and nothing said so. Each builds from dist/, so the
      # library is built first. The inline dictionary is the exception by
      # design — a link names the dictionary it was made against — so its
      # check holds that it is whole, not that it matches today's corpus.
      - run: npm run build
      - run: node scripts/build-conformance.mjs --check
      - run: node scripts/build-dictionary.mjs --check
      - run: node scripts/build-confusables.mjs --check
      - run: npm run fixtures:check

      # A second reader, sharing no code with the one that wrote the cases.
      # This is what tests the specification rather than the implementation: it
      # was written from the document, and the four places the document did not
      # say enough are the four things it could not do until they were fixed.
      - run: python3 conformance/reference/run.py

      # The merge, by the two readers that did not write the fixtures. Two
      # readers agreeing is the whole premise of the merge conformance, and a
      # reader nothing runs agrees with nothing: the Rust reader's README said
      # the conformance gate ran it, and until this step nothing did.
      - run: python3 conformance/reference/dai_merge.py
      - run: cargo run --release --quiet --manifest-path conformance/readers/rust-merge/Cargo.toml -- conformance/merge

      # The host's in-place writer, and its own unit tests. Compiling the
      # example binary here means a build failure is reported as a build failure
      # rather than as a mysterious test timeout in the Playwright suite that
      # drives it.
      - run: cargo test --manifest-path crates/sectioned/Cargo.toml
      - run: cargo build --quiet --example replace-data --manifest-path crates/sectioned/Cargo.toml

  # One browser per job, in parallel. The whole suite on three engines in one
  # job ran past the 20-minute wall and was killed every time — a timeout that
  # masks a real failure as an infrastructure hiccup, so a red suite reads as a
  # flake and nobody looks. Split by engine, each job finishes well inside its
  # budget and reports a clean pass or fail, and the summary says which engine
  # broke. `fail-fast: false` so one engine's failure does not cancel the
  # verdict on the others.
  #
  # The one thing this must never become again is a run that cannot finish: a
  # check that times out is indistinguishable from one nobody looked at, and
  # neither is a verdict. The budget below is set roughly double a single
  # engine's time on purpose — headroom, not a target. When a shard starts
  # brushing the wall, the fix is to split the shard further (by test group, by
  # directory), NOT to raise this number: raising the ceiling buys a few months
  # and restores the blind spot. If you are here to bump the timeout, shard
  # instead.
  #
  # webkit is that case: it alone ran past 25 minutes and was cancelled every
  # round — a cancelled job is no verdict, so webkit was effectively ungated and
  # its reds sat unseen. So webkit is split into two `--shard` halves that each
  # finish well inside the budget and each report a verdict; chromium and firefox
  # still run whole, one job each. The count gate skips a sharded run (its count
  # is a fraction by intent) and is carried by the two whole engines, which drop
  # the same count when a test stops being collected.
  #
  # Firefox is a reading, not the gate (ruled 25 September). Chromium and the
  # two WebKit halves decide the run; a Firefox red does not. The reason is
  # D32: `returning-document:511` failed at least once on Firefox in 3 of the
  # last 4 runs on the identity branch, a frame the automation cannot see and
  # not a product failure on the walk. The Firefox job still runs whole and
  # scripts/ci-verdict.mjs prints its tally on its own line, so a real Firefox
  # red is seen; it just does not block. Undoing this is D32 closing, not a
  # quiet week.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The specs that open no browser are their own project (see
          # playwright.config.ts) and run once, here, where the count gate
          # holds them — not once per engine.
          - { browser: chromium, part: whole, extra: "--project=node" }
          - { browser: firefox, part: whole }
          - { browser: webkit, part: "1", shard: "1/2" }
          - { browser: webkit, part: "2", shard: "2/2" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The website has its own dependency tree, and the suite now opens its
      # pages: a control can vanish from one without any other test noticing.
      - run: npm --prefix website ci

      # This engine, and chromium — always. Some tests drive a Chromium
      # subprocess whatever the engine under test: the evaluation and try-harness
      # score an application by launching it (scripts/try-container.mjs, which can
      # only drive Chromium), so a job that installed only firefox or webkit
      # failed them with "chromium is not installed" and read as an engine defect.
      # Installing it everywhere keeps the coverage the same on every engine —
      # the alternative, skipping those tests off Chromium, would make "green on
      # three engines" a claim that is not true. --with-deps pulls the system
      # libraries each needs.
      - run: npx playwright install --with-deps ${{ matrix.browser }} chromium

      - run: npm test -- --project=${{ matrix.browser }} ${{ matrix.extra }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.part }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # The evidence for a test that failed and then passed on retry. The step
      # above runs only when the job fails, and a job whose failures all pass on
      # retry is a passed job, so every trace of a flake was thrown away — a
      # flake investigated three times with nothing to look at. `trace:
      # "retain-on-failure"` already keeps the failed attempt's trace; this keeps
      # it past the job. Only what a failed attempt leaves, so a clean run
      # uploads nothing.
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retried-${{ matrix.browser }}-${{ matrix.part }}
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
