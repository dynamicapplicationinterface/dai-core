name: test

on:
  push:
    branches: [main]
  pull_request:

# The suite needs to read the repository and nothing else. Without this the
# token defaults to whatever the repository's setting allows, which on a public
# repository is a wider grant than a test run has any use for.
permissions:
  contents: read

jobs:
  # The non-browser checks, on their own so a compile or reference-reader
  # failure is reported as itself and does not sit behind twelve minutes of
  # Playwright.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # A second reader, sharing no code with the one that wrote the cases.
      # This is what tests the specification rather than the implementation: it
      # was written from the document, and the four places the document did not
      # say enough are the four things it could not do until they were fixed.
      - run: python3 conformance/reference/run.py

      # The host's in-place writer, and its own unit tests. Compiling the
      # example binary here means a build failure is reported as a build failure
      # rather than as a mysterious test timeout in the Playwright suite that
      # drives it.
      - run: cargo test --manifest-path crates/sectioned/Cargo.toml
      - run: cargo build --quiet --example replace-data --manifest-path crates/sectioned/Cargo.toml

  # One browser per job, in parallel. The whole suite on three engines in one
  # job ran past the 20-minute wall and was killed every time — a timeout that
  # masks a real failure as an infrastructure hiccup, so a red suite reads as a
  # flake and nobody looks. Split by engine, each job finishes well inside its
  # budget and reports a clean pass or fail, and the summary says which engine
  # broke. `fail-fast: false` so one engine's failure does not cancel the
  # verdict on the others.
  #
  # The one thing this must never become again is a run that cannot finish: a
  # check that times out is indistinguishable from one nobody looked at, and
  # neither is a verdict. The budget below is set roughly double a single
  # engine's time on purpose — headroom, not a target. When a shard starts
  # brushing the wall, the fix is to split the shard further (by test group, by
  # directory), NOT to raise this number: raising the ceiling buys a few months
  # and restores the blind spot. If you are here to bump the timeout, shard
  # instead.
  #
  # webkit is that case: it alone ran past 25 minutes and was cancelled every
  # round — a cancelled job is no verdict, so webkit was effectively ungated and
  # its reds sat unseen. So webkit is split into two `--shard` halves that each
  # finish well inside the budget and each report a verdict; chromium and firefox
  # still run whole, one job each. The count gate skips a sharded run (its count
  # is a fraction by intent) and is carried by the two whole engines, which drop
  # the same count when a test stops being collected.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, part: whole }
          - { browser: firefox, part: whole }
          - { browser: webkit, part: "1", shard: "1/2" }
          - { browser: webkit, part: "2", shard: "2/2" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The website has its own dependency tree, and the suite now opens its
      # pages: a control can vanish from one without any other test noticing.
      - run: npm --prefix website ci

      # --with-deps pulls the system libraries this engine needs on CI.
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm test -- --project=${{ matrix.browser }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.part }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
