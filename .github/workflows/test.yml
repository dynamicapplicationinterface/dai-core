name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The website has its own dependency tree, and the suite now opens its
      # pages: a control can vanish from one without any other test noticing.
      - run: npm --prefix website ci

      # A second reader, sharing no code with the one that wrote the cases.
      # This is what tests the specification rather than the implementation: it
      # was written from the document, and the four places the document did not
      # say enough are the four things it could not do until they were fixed.
      - run: python3 conformance/reference/run.py

      # The host's in-place writer, and its own unit tests. Run before the
      # Playwright suite because one of those tests drives this crate's example
      # binary: compiling it here means a build failure is reported as a build
      # failure rather than as a mysterious test timeout.
      - run: cargo test --manifest-path crates/sectioned/Cargo.toml
      - run: cargo build --quiet --example replace-data --manifest-path crates/sectioned/Cargo.toml

      # --with-deps pulls the system libraries WebKit and Firefox need on CI.
      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
